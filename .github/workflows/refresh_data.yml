name: Refresh dashboard data

on:
  schedule:
    # 12:00 UTC daily (~8am US Eastern). Cron is always UTC -- adjust the
    # hour here if you want the refresh to land at a different local time.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fredapi boto3 python-dotenv pandas pyarrow dbt-core dbt-duckdb

      - name: Ingest latest FRED series to S3
        run: python ingestion/fetch_fred.py

      - name: Transform and join indicators, write processed Parquet to S3
        run: python spark/transform_indicators_local.py

      - name: Build dbt models
        working-directory: dbt
        run: |
          dbt run

      - name: Export dashboard snapshot + refresh metadata
        run: python scripts/export_dashboard_snapshot.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/economic_dashboard.parquet data/last_updated.json
          if git diff --cached --quiet; then
            echo "No data changes -- skipping commit."
          else
            git commit -m "Refresh dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi
